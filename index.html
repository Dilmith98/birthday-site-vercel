<style>
/* Layout: a single scrolling love letter — hero with a cake to "blow out", polaroid gallery, then the note itself */
:root{
  --bg:#fbf3f4;          /* blush paper */
  --surface:#ffffff;
  --ink:#3d1626;         /* deep wine */
  --muted:#8a6170;
  --rose:#c2456b;        /* accent */
  --gold:#b88a3a;
  --line:#ecd6dc;
  --ph1:#f3c9d4; --ph2:#e9b7a8; --ph3:#d9c3e8;
  --shadow:rgba(61,22,38,.14);
  --sponge:#f7cdd8;--cream:#fffaf6;--stand:#ead9df;--lilac:#b39ddb;--mint:#7cc6b0;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-script:"Pinyon Script","Brush Script MT",cursive;
  --f-body:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1e0f16;--surface:#2a1620;--ink:#f8e6ec;--muted:#c49aa9;--rose:#ee7c9d;--gold:#dcb36a;--line:#40242f;
  --ph1:#5a2a3b;--ph2:#5b3a32;--ph3:#3f3256;--shadow:rgba(0,0,0,.45);--sponge:#8c4660;--cream:#f9e7ee;--stand:#4b2b38;--lilac:#b9a3e3;--mint:#7fcab4;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e0f16;--surface:#2a1620;--ink:#f8e6ec;--muted:#c49aa9;--rose:#ee7c9d;--gold:#dcb36a;--line:#40242f;
  --ph1:#5a2a3b;--ph2:#5b3a32;--ph3:#3f3256;--shadow:rgba(0,0,0,.45);--sponge:#8c4660;--cream:#f9e7ee;--stand:#4b2b38;--lilac:#b9a3e3;--mint:#7fcab4;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
.wrap{max-width:1040px;margin:0 auto}
h1,h2{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* Hero */
.hero{padding-block:72px 40px;text-align:center;display:grid;gap:18px;justify-items:center;position:relative}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.1}
.hero .name{display:block;font-family:var(--f-script);font-size:clamp(3.6rem,13vw,7rem);color:var(--rose);line-height:1.05;margin-top:4px}
.hero p{max-width:34rem;color:var(--muted);margin:0}
.cake{margin-top:8px;display:grid;justify-items:center}
.cake svg{width:min(300px,82vw);height:auto;max-width:100%;overflow:visible;filter:drop-shadow(0 14px 18px var(--shadow))}
.c-sponge{fill:var(--sponge)}.c-cream{fill:var(--cream)}.c-fill{fill:var(--rose)}.c-stand{fill:var(--stand)}.c-standdark{fill:var(--line)}
.c-s1{fill:var(--gold)}.c-s2{fill:var(--rose)}.c-s3{fill:var(--lilac)}.c-s4{fill:var(--mint)}
.c-wick{stroke:var(--ink);stroke-width:1.5;stroke-linecap:round}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.1s ease-in-out infinite alternate;transition:opacity .4s,transform .4s}
.flame:nth-of-type(2n){animation-duration:.9s}
.glow{transition:opacity .4s}
.blown .flame{opacity:0;transform:scale(.2) translateY(6px);animation:none}
.blown .glow{opacity:0}
.smoke{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;opacity:0}
.blown .smoke{animation:smoke 1.6s ease-out forwards}
@keyframes smoke{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-18px)}}
@keyframes flicker{to{transform:rotate(4deg) scaleY(1.12)}}
button.wish{font:600 .95rem var(--f-body);color:#fff;background:var(--rose);border:0;border-radius:999px;padding:12px 26px;cursor:pointer;transition:transform .15s}
button.wish:hover{transform:translateY(-2px)}
button.wish:focus-visible,.tile:focus-visible,.close:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wish-msg{min-height:1.6em;font-family:var(--f-display);font-style:italic;color:var(--rose);margin:0}

/* Gallery */
section{padding-block:56px}
.head{text-align:center;display:grid;gap:8px;margin-bottom:36px}
.head h2{font-size:clamp(1.8rem,4.5vw,2.6rem)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px 22px}
.tile{all:unset;cursor:pointer;background:var(--surface);padding:12px 12px 14px;box-shadow:0 10px 26px var(--shadow);border-radius:3px;display:grid;gap:10px;
  transition:transform .25s ease}
.tile:nth-child(odd){transform:rotate(-1.6deg)}
.tile:nth-child(even){transform:rotate(1.4deg)}
.tile:hover{transform:rotate(0) translateY(-4px)}
.photo{aspect-ratio:3/4;object-position:50% 25%;max-width:100%;width:100%;object-fit:cover;display:block;background:var(--ph1)}
.ph{display:grid;place-items:center;text-align:center;color:var(--ink);font-size:.82rem;opacity:.9;padding:12px}
.ph b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:400}
.tile:nth-child(3n+2) .ph{background:var(--ph2)}
.tile:nth-child(3n) .ph{background:var(--ph3)}
.cap{font-family:var(--f-script);font-size:1.6rem;text-align:center;line-height:1.1;color:var(--ink)}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(20,6,12,.86);display:grid;place-items:center;z-index:20;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox figure{margin:0;display:grid;gap:12px;justify-items:center;max-width:min(860px,100%)}
.lightbox .photo{max-height:78vh;width:auto;aspect-ratio:auto;border-radius:4px}
.lightbox .ph{width:min(420px,80vw);aspect-ratio:4/5}
.lightbox figcaption{color:#fbe9ee;font-family:var(--f-script);font-size:2rem}
.close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));background:none;border:0;color:#fff;font-size:2rem;cursor:pointer;line-height:1}

/* Letter */
.letter{max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--line);padding:44px clamp(22px,6vw,56px);box-shadow:0 14px 34px var(--shadow);
  background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-position:0 18px}
.letter .dear{font-family:var(--f-script);font-size:2.4rem;color:var(--rose);margin:0 0 8px}
.letter p{font-family:var(--f-display);font-size:1.12rem;line-height:32px;margin:0 0 32px}
.letter .sign{text-align:right;font-family:var(--f-script);font-size:2rem;margin:0;color:var(--ink)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding-block:40px 60px}

/* Music toggle */
.music{position:fixed;z-index:15;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:8px;font:600 .9rem var(--f-body);color:var(--ink);background:var(--surface);border:2px solid var(--rose);
  border-radius:999px;padding:10px 16px;cursor:pointer;box-shadow:0 8px 20px var(--shadow)}
.music:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.music .note{color:var(--rose);font-size:1.1rem;display:inline-block}
.music.playing .note{animation:bob 0.9s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px) rotate(-10deg)}}

/* Hearts */
.heart{position:fixed;pointer-events:none;color:var(--rose);font-size:22px;z-index:30;animation:rise 2.4s ease-out forwards}
@keyframes rise{to{transform:translate(var(--dx),-60vh) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.flame,.heart{animation:none}.tile,.tile:nth-child(n){transition:none}}
@media (max-width:480px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}.cap{font-size:1.25rem}.tile{padding:8px 8px 10px}}
</style>

<script>
/* ===== EDIT HERE: her name, your message and your photos ===== */
const SITE = {
  name: "My Love",                 // her name, e.g. "Nethmi"
  from: "Forever yours",           // how you sign the letter
  letter: [
    "Happy birthday to the person who makes every day brighter. Thank you for your patience, your warmth, and the way you believe in me even when I forget to believe in myself.",
    "Every photo on this page is a moment I'd happily live again. I can't wait to make many more of them with you.",
    "I love you more than words on a page can say. Have the most wonderful birthday."
  ],
  // Put photo files in the "photos" folder and list them here. Leave src "" to show a placeholder.
  photos: [
    { src: "photos/01.jpg", caption: "Just us" },
    { src: "photos/02.jpg", caption: "Pretty in pink" },
    { src: "photos/03.jpg", caption: "Dinner dates" },
    { src: "photos/04.jpg", caption: "That smile" },
    { src: "photos/05.jpg", caption: "Adventures together" },
    { src: "photos/06.jpg", caption: "Matching in red" },
    { src: "photos/07.jpg", caption: "My sunshine" },
    { src: "photos/08.jpg", caption: "So proud of you" },
    { src: "photos/09.jpg", caption: "Side by side" },
    { src: "photos/10.jpg", caption: "Our wedding day" },
    { src: "photos/11.jpg", caption: "My beautiful bride" }
  ]
};
/* ============================================================== */

const $ = id => document.getElementById(id);
$("her-name").textContent = SITE.name;
document.title = "Happy Birthday, " + SITE.name;
$("dear").textContent = "My dearest " + SITE.name + ",";
$("sign").textContent = SITE.from;
$("letter-body").innerHTML = "";
SITE.letter.forEach(t => { const p = document.createElement("p"); p.textContent = t; $("letter-body").appendChild(p); });

function photoEl(ph, i){
  if (ph.src){ const img = document.createElement("img"); img.className = "photo"; img.src = ph.src; img.alt = ph.caption || ("Photo " + (i+1)); img.loading = "lazy"; return img; }
  const d = document.createElement("div"); d.className = "photo ph";
  d.innerHTML = "<span><b>Photo " + (i+1) + "</b>placeholder: add your photo</span>"; return d;
}
SITE.photos.forEach((ph, i) => {
  const b = document.createElement("button"); b.className = "tile"; b.type = "button";
  b.setAttribute("aria-label", "Open photo: " + (ph.caption || i+1));
  b.appendChild(photoEl(ph, i));
  const c = document.createElement("span"); c.className = "cap"; c.textContent = ph.caption; b.appendChild(c);
  b.addEventListener("click", () => openLb(i));
  $("gallery").appendChild(b);
});

let lastFocus = null;
function openLb(i){
  const ph = SITE.photos[i], fig = $("lb-fig"); fig.innerHTML = "";
  fig.appendChild(photoEl(ph, i));
  const cap = document.createElement("figcaption"); cap.textContent = ph.caption; fig.appendChild(cap);
  lastFocus = document.activeElement; $("lightbox").hidden = false; $("close").focus();
}
function closeLb(){ $("lightbox").hidden = true; if (lastFocus) lastFocus.focus(); }
$("close").addEventListener("click", closeLb);
$("lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closeLb(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("lightbox").hidden) closeLb(); });

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function hearts(n){
  if (reduce) return;
  for (let k = 0; k < n; k++){
    const h = document.createElement("span"); h.className = "heart"; h.textContent = "♥";
    h.style.left = (10 + Math.random()*80) + "vw"; h.style.top = (70 + Math.random()*25) + "vh";
    h.style.fontSize = (14 + Math.random()*22) + "px";
    h.style.setProperty("--dx", (Math.random()*120 - 60) + "px");
    h.style.setProperty("--r", (Math.random()*80 - 40) + "deg");
    h.style.animationDelay = (Math.random()*0.6) + "s";
    document.body.appendChild(h); setTimeout(() => h.remove(), 3200);
  }
}
$("wish").addEventListener("click", () => {
  const cake = $("cake"), blown = cake.classList.toggle("blown");
  $("wish").textContent = blown ? "Light the candles again" : "Make a wish & blow out the candles";
  $("wish-msg").textContent = blown ? "I hope every wish comes true, " + SITE.name + " ♥" : "";
  if (blown){ hearts(28); startSong(); }
});

/* ===== Happy Birthday song, played as a soft music box (no audio file needed) ===== */
const N = {G2:98,F2:87.31,C3:130.81,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
const MELODY = [ // [note, beats], 3/4 time
  ["G4",.75],["G4",.25],["A4",1],["G4",1],["C5",1],["B4",2],
  ["G4",.75],["G4",.25],["A4",1],["G4",1],["D5",1],["C5",2],
  ["G4",.75],["G4",.25],["G5",1],["E5",1],["C5",1],["B4",1],["A4",2],
  ["F5",.75],["F5",.25],["E5",1],["C5",1],["D5",1],["C5",3]
];
const BASS = [[null,1],["C3",3],["G2",3],["G2",3],["C3",3],["C3",3],["F2",3],["G2",3],["C3",3]]; // rest on the pickup, one chord root per bar
const BEAT = 0.52;
let ctx = null, master = null, playing = false, loopTimer = null;

function tone(freq, t, dur, vol){
  const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
  o1.type = "triangle"; o2.type = "sine"; o1.frequency.value = freq; o2.frequency.value = freq*2;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur*1.6, 0.6));
  o1.connect(g); o2.connect(g); g.connect(master);
  o1.start(t); o2.start(t); o1.stop(t + 2); o2.stop(t + 2);
}
function playOnce(){
  if (!playing) return;
  let t = ctx.currentTime + 0.1, total = 0;
  MELODY.forEach(([n,b]) => { tone(N[n], t + total*BEAT, b*BEAT, 0.22); total += b; });
  let bt = 0; BASS.forEach(([n,b]) => { if (n) tone(N[n], t + bt*BEAT, b*BEAT, 0.1); bt += b; });
  loopTimer = setTimeout(playOnce, (total + 3) * BEAT * 1000); // short pause, then repeat
}
function setMusicUI(){
  $("music").classList.toggle("playing", playing);
  $("music").setAttribute("aria-pressed", String(playing));
  $("music-label").textContent = playing ? "Pause song" : "Play birthday song";
}
function startSong(){
  if (playing) return;
  try{
    if (!ctx){ ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = 0.7; master.connect(ctx.destination); }
    ctx.resume(); playing = true; setMusicUI(); playOnce();
  }catch(e){ playing = false; setMusicUI(); }
}
function stopSong(){
  playing = false; clearTimeout(loopTimer); setMusicUI();
  if (ctx){ ctx.close(); ctx = null; }
}
$("music").addEventListener("click", () => playing ? stopSong() : startSong());
</script>
